{% extends 'base.html' %}
{% block title %}{{ titulo }} — FitPulse{% endblock %}
{% block content %}
<main class="py-5">
  <div class="container" style="max-width: 640px;">
    <div class="card-product p-4 p-md-5">
      <h3 class="text-white fw-bold mb-4">{{ titulo }}</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg me-1"></i>Salvar</button>
          <a href="{{ voltar }}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
