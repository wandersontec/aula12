<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label small fw-semibold text-secondary">{{ field.label }}</label>
  <div class="d-flex align-items-center login-input-group">
    <span class="login-input-icon"><i class="bi {% if 'password' in field.name %}bi-lock{% else %}bi-person{% endif %}"></i></span>
    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           class="form-control login-input-field" placeholder="{{ field.label }}" required
           {% if 'password' not in field.name %}value="{{ field.value|default_if_none:'' }}"{% endif %}>
  </div>
  {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}
  {% if field.help_text %}<div class="text-secondary small mt-1" style="font-size: 0.75rem;">{{ field.help_text|safe }}</div>{% endif %}
</div>
