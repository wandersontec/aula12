<div class="col">
  <div class="card-product h-100 p-3 d-flex flex-column position-relative">
    {% if user.is_authenticated %}
    <a href="{% url 'plano_editar' p.id %}" class="btn btn-sm btn-outline-light rounded-circle position-absolute top-0 end-0 m-3" style="z-index: 5;" title="Editar {{ p.nome }}">
      <i class="bi bi-pencil-fill"></i>
    </a>
    {% endif %}
    <div class="product-img-box mb-3 position-relative overflow-hidden">
      {% if p.imagem_url %}<img src="{{ p.imagem_url }}" alt="{{ p.nome }}" class="w-100 h-100 object-fit-cover rounded">
      {% else %}<i class="bi bi-egg-fried text-secondary fs-1"></i>{% endif %}
      <span class="badge badge-sale position-absolute top-0 start-0 m-2">{{ p.get_objetivo_display }}</span>
    </div>
    <h5 class="product-title">{{ p.nome }}</h5>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="product-price mb-0">{{ p.calorias_dia }} kcal/dia</span>
    </div>
    <a href="{% url 'plano_detalhe' p.id %}" class="btn btn-accent w-100 mt-auto"><i class="bi bi-eye me-2"></i>Ver detalhes</a>
  </div>
</div>
